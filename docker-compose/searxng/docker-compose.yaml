# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core-demo
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    volumes:
      - /volume3/docker/searxng/core-config/:/etc/searxng/:Z
      - /volume3/docker/searxng/core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey-demo
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - /volume3/docker/searxng/valkey-data:/data/

networks:
  default:
    name: searxng-net
    external: true
